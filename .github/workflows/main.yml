# Unsigned iOS IPA build (iOS target only; all other targets removed).
# Run it from the Actions tab (Run workflow) or by pushing to master.
# The IPA is uploaded as the "qz-ios-unsigned-ipa" artifact on the run summary page.

name: CI

env:
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

on:
  workflow_dispatch:
  push:
    branches: [ master,  github-workflow-playground ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    # The type of runner that the job will run on
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Checkout submodule repo
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: "src/smtpclient/"
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c
      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          path: "tst/googletest/"
          ref: "release-1.12.1"

      - name: Install Qt iOS
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'mac'
          target: 'ios'
          modules: 'qtcharts  qtnetworkauth'
          dir: '${{ github.workspace }}/output/ios/'
          cache: 'true'
          cache-key-prefix: 'install-qt-action-ios'                    
          
      - name: fix qt
        run: find ${{ github.workspace }}/output/ios/ -name 'ios.conf' -exec sed -i '' 's/ios-simulator/iphonesimulator/g' {} \;
      
      - name: fix qt
        run: find ${{ github.workspace }}/output/ios/ -name 'devices.py' -exec sed -i '' 's/\/usr\/bin\/python/\/usr\/bin\/python3/g' {} \;        

      - name: fix qt
        run: find ./ -name 'qdomyos-zwift-lib.pro' -exec sed -i '' 's/TARGET = qdomyos-zwift/TARGET = qdomyoszwift/g' {} \;                

      - name: patching qt for bluetooth
        run: cp qt-patches/ios/5.15.2/binary/*.* ${{ github.workspace }}/output/ios/Qt/5.15.2/ios/lib/

      - name: Setup ccache
        run: |
          brew install ccache
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=base_dir=${{ github.workspace }}
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,file_macro,clang_index_store
          ccache --zero-stats
          # Create wrapper scripts for Xcode (which uses absolute compiler paths, ignoring PATH)
          mkdir -p /tmp/ccache-wrappers
          printf '#!/bin/bash\nexec /opt/homebrew/bin/ccache clang "$@"\n' > /tmp/ccache-wrappers/clang
          printf '#!/bin/bash\nexec /opt/homebrew/bin/ccache clang++ "$@"\n' > /tmp/ccache-wrappers/clang++
          chmod +x /tmp/ccache-wrappers/clang /tmp/ccache-wrappers/clang++

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ios-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/*.pro') }}
          restore-keys: |
            ccache-ios-

      - name: Build
        run: |
          cd src
          echo "#define STRAVA_SECRET_KEY ${{ secrets.strava_secret_key }}" > secret.h
          echo "#define PELOTON_SECRET_KEY ${{ secrets.peloton_secret_key }}" >> secret.h
          echo "#define SMTP_USERNAME ${{ secrets.smtp_username }}" >> secret.h
          echo "#define SMTP_PASSWORD ${{ secrets.smtp_password }}" >> secret.h
          echo "#define SMTP_SERVER ${{ secrets.smtp_server }}" >> secret.h
          echo "#define INTERVALSICU_CLIENT_ID ${{ secrets.intervalsicu_client_id }}" >> secret.h
          echo "#define INTERVALSICU_CLIENT_SECRET ${{ secrets.intervalsicu_client_secret }}" >> secret.h
          echo "${{ secrets.cesiumkey }}" >> inner_templates/googlemaps/cesium-key.js
          cd ..
          # Device (iphoneos, arm64) release build. Same qmake flags the repo's Xcode Cloud script uses.
          qmake -spec macx-ios-clang CONFIG+=release CONFIG+=device CONFIG-=simulator CONFIG+=iphoneos "QMAKE_APPLE_DEVICE_ARCHS=arm64"
          # The project is configured for automatic signing with the author's team, which can't
          # work on CI. Wrap xcodebuild so every call made by `make` disables code signing.
          mkdir -p /tmp/xcb-shim
          printf '#!/bin/bash\nexec /usr/bin/xcodebuild "$@" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""\n' > /tmp/xcb-shim/xcodebuild
          chmod +x /tmp/xcb-shim/xcodebuild
          export PATH="/tmp/xcb-shim:$PATH"
          make -j4

      - name: Package unsigned IPA
        run: |
          APP=$(find "${{ github.workspace }}" -type d -name "*.app" -path "*-iphoneos/*" -not -path "*.app/*" -not -path "*/output/ios/*" | head -n1)
          if [ -z "$APP" ]; then
            echo "No device .app was produced. Candidate .app folders:"
            find "${{ github.workspace }}" -type d -name "*.app" -not -path "*.app/*" | head -20
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf ipa-out && mkdir -p ipa-out/Payload
          cp -R "$APP" ipa-out/Payload/
          cd ipa-out
          zip -qry QZ-unsigned.ipa Payload
          ls -lh QZ-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qz-ios-unsigned-ipa
          path: ipa-out/QZ-unsigned.ipa
          if-no-files-found: error

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
